backend:
  name: github
  repo: Bkeefe901/Yaadwine
  branch: main
  # Netlify acts purely as the OAuth relay here (exchanging GitHub's
  # auth code for a token) — this does NOT use Netlify Identity/Git
  # Gateway, which is being sunset. See README notes for setup.
  base_url: https://api.netlify.com
  auth_endpoint: auth

# Lets `npx decap-server` run locally so the CMS can be tried out
# against your local git working copy, with no GitHub auth needed.
# Only takes effect when the CMS detects that local proxy running.
local_backend: true

media_folder: "assets/drink-time-photos"
public_folder: "assets/drink-time-photos"

collections:
  - name: "cellar"
    label: "Cellar Episodes"
    label_singular: "Cellar Episode"
    folder: "src/posts"
    create: true
    slug: "{{slug}}"
    filter: { field: "layout", value: "layouts/post-episode.njk" }
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "layouts/post-episode.njk" }
      - { label: "Tags", name: "tags", widget: "hidden", default: ["post"] }

      - { label: "Page Title (browser tab / SEO)", name: "title", widget: "string" }
      - { label: "Meta Description", name: "description", widget: "text" }
      - { label: "Social Share Description", name: "ogDescription", widget: "text", required: false, hint: "Falls back to Meta Description if left blank." }
      - { label: "Social Share Image", name: "ogImage", widget: "image", default: "assets/og-image.png", required: false, media_folder: "/assets", public_folder: "/assets" }

      - { label: "Eyebrow (series / episode label)", name: "eyebrow", widget: "string", hint: "e.g. \"Wine Through Migration — Episode 1\"" }
      - { label: "Hero Title", name: "heroTitle", widget: "string", hint: "Use <br> for a manual line break." }
      - { label: "Hero Stamps", name: "heroStamps", widget: "list", required: false, hint: "Short labels shown at the top, e.g. CAHORS, MENDOZA." }
      - label: "Closing Stamps"
        name: "closeStamps"
        widget: "list"
        required: false
        fields:
          - { label: "Label", name: "label", widget: "string" }
          - { label: "Outlined style", name: "outline", widget: "boolean", default: false, required: false }
      - { label: "Closing Tagline", name: "tagline", widget: "string", hint: "Use <br> for a manual line break." }

      - label: "Pillar"
        name: "pillar"
        widget: "select"
        options: ["migration", "science", "culture"]
        hint: "Which section of the Cellar page this appears under."
      - { label: "Cellar Card Title", name: "cardTitle", widget: "string", hint: "Short title shown on the Cellar page card — can differ from the Page Title." }
      - { label: "Cellar Card Question", name: "humanQuestion", widget: "string" }

      - { label: "Output filename", name: "permalink", widget: "string", hint: "e.g. my-story.html — this becomes the page's URL." }

      - { label: "Story", name: "body", widget: "markdown" }

  - name: "drinktime"
    label: "Drink Time"
    label_singular: "Drink Time Post"
    folder: "src/posts"
    create: true
    slug: "{{slug}}"
    filter: { field: "layout", value: "layouts/post-drinktime.njk" }
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "layouts/post-drinktime.njk" }
      - { label: "Tags", name: "tags", widget: "hidden", default: ["post"] }
      - { label: "Pillar", name: "pillar", widget: "hidden", default: "drinktime" }

      - { label: "Page Title (browser tab / SEO)", name: "title", widget: "string" }
      - { label: "Meta Description", name: "description", widget: "text" }
      - { label: "Social Share Image", name: "ogImage", widget: "image", default: "assets/og-image.png", required: false, media_folder: "/assets", public_folder: "/assets" }

      - { label: "Eyebrow", name: "eyebrow", widget: "string", default: "Drink Time" }
      - { label: "Hero Title", name: "heroTitle", widget: "string", hint: "Use <br> for a manual line break." }

      - label: "The Wine"
        name: "wine"
        widget: "object"
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Region", name: "region", widget: "string" }
          - { label: "Details", name: "body", widget: "markdown" }
          - { label: "Tags", name: "tags", widget: "list", hint: "e.g. Unfined, Unfiltered, Zero SO2 Added" }

      - { label: "My Take", name: "takeContent", widget: "markdown" }
      - label: "Photo"
        name: "photo"
        widget: "object"
        required: false
        fields:
          - { label: "Image", name: "src", widget: "image", required: false }
          - { label: "Alt text", name: "alt", widget: "string", required: false }
          - { label: "Caption", name: "caption", widget: "string", required: false }
      - { label: "Closing beat line", name: "takeBeatLine", widget: "string" }

      - { label: "Closing Line", name: "closingLine", widget: "string", hint: "Use <br> for a manual line break." }
      - { label: "Closing Sub-line", name: "closingSub", widget: "string" }

      - { label: "Cellar Card Title", name: "cardTitle", widget: "string" }
      - { label: "Cellar Card Question", name: "humanQuestion", widget: "string" }

      - { label: "Output filename", name: "permalink", widget: "string", hint: "e.g. my-story.html — this becomes the page's URL." }

      - { label: "Story", name: "body", widget: "markdown" }
